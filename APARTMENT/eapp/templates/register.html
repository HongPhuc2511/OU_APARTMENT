{% extends 'layout/base.html' %}
{% block title %}Đăng ký{% endblock %}
{% block content %}

<div class="d-flex justify-content-center align-items-start bg-light"
     style="min-height: 130vh; padding-top: 120px; padding-bottom: 120px;">

  <div class="card shadow p-4" style="width: 100%; max-width: 500px;">
    <h2 class="text-center text-success mb-4">ĐĂNG KÝ</h2>

    {% if err_msg %}
    <div class="alert alert-danger">{{ err_msg }}</div>
    {% endif %}

    <form method="post" action="/register" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="name" class="form-label">Họ và tên</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="Nhập họ và tên" required>
      </div>

      <div class="mb-3">
        <label for="username" class="form-label">Tên đăng nhập</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="Tên đăng nhập" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="Nhập email" required>
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">Số điện thoại</label>
        <input type="text" class="form-control" id="phone" name="phone" placeholder="Nhập SĐT" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Mật khẩu</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu" required>
      </div>

      <div class="mb-3">
        <label for="confirm" class="form-label">Xác nhận mật khẩu</label>
        <input type="password" class="form-control" id="confirm" name="confirm" placeholder="Xác nhận mật khẩu" required>
      </div>

      <div class="mb-3">
        <label for="avatar" class="form-label">Ảnh đại diện</label>
        <input type="file" class="form-control" id="avatar" name="avatar" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
    </form>
  </div>
</div>

{% endblock %}
