{% extends 'layout/base.html' %}
{% block content %}
<div class="container py-5">
  <div class="row g-4 align-items-center">

    <div class="col-md-6">
      <div class="border rounded shadow-sm overflow-hidden">
        <img src="{{ apartment.image }}" alt="{{ apartment.name }}" class="img-fluid w-100">
      </div>
    </div>

    <div class="col-md-6">
      <h2 class="text-primary fw-bold mb-3">{{ apartment.name }}</h2>
      <ul class="list-unstyled fs-5">
        <li><strong>Loại căn hộ:</strong> {{ apartment.apartment_type.name }}</li>
        <li><strong>Diện tích:</strong> {{ apartment.area }} m²</li>
        <li><strong>Giá thuê:</strong> <span class="text-danger fw-bold">{{ "{:,.0f}".format(apartment.price) }} VNĐ/tháng</span></li>
      </ul>

      <div class="d-flex gap-3 mt-4">
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary px-4">Quay lại danh sách</a>
        <button class="btn btn-success px-4" onclick="addToCart(
              {{ apartment.id }},
              '{{ apartment.name }}',
              {{ apartment.price }},
              {{ apartment.area }},
              '{{ apartment.apartment_type.name }}',
              '{{ apartment.image }}'
          )">Đặt thuê</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
